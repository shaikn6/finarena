name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finarena .
      - name: smoke test the container
        run: |
          docker run -d --name fa -p 8000:8000 -e FINARENA_API_KEYS=ci-key finarena
          for i in $(seq 1 40); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/sentiment -d '{}')" = "401"
          curl -sf -X POST localhost:8000/v1/sentiment -H 'x-api-key: ci-key' -H 'content-type: application/json' \
            -d '{"texts":["Shares plunge after SEC probe"],"strategy":"fast"}' | grep -q Bearish
          curl -sf -X POST localhost:8000/v1/credit/score -H 'x-api-key: ci-key' -H 'content-type: application/json' \
            -d '{"applications":[{"limit_bal":50000,"education":2,"marriage":1,"age":35,"pay_status":[3,3,2,2,2,2],"bill_amt":[48000,48000,48000,48000,48000,48000],"pay_amt":[0,0,0,0,0,0]}]}' | grep -q decline
          curl -sf -X POST localhost:8000/v1/analyze -H 'x-api-key: ci-key' -H 'content-type: application/json' \
            -d '{"items":[{"task":"sentiment","text":"Shares plunge after SEC probe"}]}' | grep -q Bearish
          curl -sf localhost:8000/metrics -H 'x-api-key: ci-key' | grep -q finarena_requests_total
          test "$(docker exec fa id -u)" = "10001"
      - if: failure()
        run: docker logs fa
