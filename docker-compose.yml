# Run FinArena locally or on any Docker host:   cp .env.example .env   (edit the keys)   docker compose up -d --build
services:
  finarena:
    build:
      context: .
      args:
        EXTRAS: ${EXTRAS:-}
        PRELOAD_LLM: ${PRELOAD_LLM:-0}
    image: finarena:${IMAGE_TAG:-latest}
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    restart: unless-stopped
    read_only: true            # the service writes nothing to disk
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
